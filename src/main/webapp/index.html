<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Slime Rancher Tracker</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/estilos.css">
<script src="js/tema.js"></script>
<script type="module" src="js/paginas/panel.js"></script>
</head>
<body>
<header class="cabecera">
  <a class="marca" href="index.html"><span class="marca__slime" aria-hidden="true"></span><span class="marca__nombre">Slime Rancher Tracker</span></a>
  <nav class="nav" aria-label="Principal">
    <a href="index.html" aria-current="page">Panel</a>
    <a href="zonas.html">Zonas</a>
    <a href="slimepedia.html">Slimepedia</a>
    <a href="logros.html">Logros</a>
  </nav>
  <div class="cabecera__usuario">
    <a class="selector-partida" href="partidas.html"><span>Partida</span><strong data-nombre-partida>…</strong>
      <svg class="selector-partida__icono" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></a>
    <button type="button" class="btn-tema" data-alternar-tema aria-label="Cambiar a modo oscuro"><svg class="tema-luna" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><svg class="tema-sol" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button>
    <a class="enlace-salir" href="login.html" data-salir>Salir</a>
  </div>
</header>

<main class="contenedor contenedor--panel">
  <div class="avisos" aria-live="polite" data-aviso></div>

  <section class="panel-cabeza" aria-labelledby="titulo-progreso">
    <div class="panel-cabeza__numero">
      <p class="subtitulo panel-cabeza__subtitulo" data-actualizada>Cargando tu partida…</p>
      <h1 id="titulo-progreso" class="cifra" data-cifra>&nbsp;</h1>
      <p class="cifra-texto">del Far, Far Range registrado. Zonas, Slimepedia y logros cuentan lo mismo.</p>
    </div>
    <div class="resumen tarjeta">
      <a class="resumen__fila" href="zonas.html"><span>Zonas</span>
        <span class="pips" aria-hidden="true" data-pips="zonas"></span><span data-cuenta="zonas"></span></a>
      <a class="resumen__fila" href="slimepedia.html"><span>Slimepedia</span>
        <span class="pips" aria-hidden="true" data-pips="slimes"></span><span data-cuenta="slimes"></span></a>
      <a class="resumen__fila" href="logros.html"><span>Logros</span>
        <span class="pips" aria-hidden="true" data-pips="logros"></span><span data-cuenta="logros"></span></a>
    </div>
  </section>

  <div class="dos-columnas">
    <section class="tarjeta tarjeta-zonas" aria-labelledby="titulo-zonas">
      <div class="cabecera-tarjeta">
        <h2 id="titulo-zonas" class="titulo-seccion">Slimepedia por zona</h2>
        <a class="enlace-fuerte" href="slimepedia.html">Abrir Slimepedia</a>
      </div>
      <div data-por-zona><p class="estado">Cargando…</p></div>
    </section>

    <div class="columna-lateral">
      <section class="bloque" aria-labelledby="titulo-ahora">
        <h2 id="titulo-ahora" class="titulo-seccion">Ahora puedes</h2>
        <div class="bloque" data-pasos></div>
      </section>
      <section class="bloque" aria-labelledby="titulo-cambios">
        <h2 id="titulo-cambios" class="titulo-seccion">Últimos cambios</h2>
        <ol class="lista-cambios" data-cambios></ol>
      </section>
    </div>
  </div>
</main>
</body>
</html>
