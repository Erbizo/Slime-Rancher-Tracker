<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis partidas · Slime Rancher Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<script src="tema.js"></script>
</head>
<body>
<header class="cabecera">
  <a class="marca" href="panel.html" style="flex: 1 1 auto"><span class="marca__slime" aria-hidden="true"></span><span class="marca__nombre">Slime Rancher Tracker</span></a>
  <div class="cabecera__usuario" style="gap: 12px">
    <span style="color: var(--texto-2)">Conectado como <strong style="font-weight: 600; color: var(--texto)">rancher</strong></span>
    <button type="button" class="btn-tema" data-alternar-tema aria-label="Cambiar a modo oscuro"><svg class="tema-luna" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><svg class="tema-sol" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button>
    <a class="enlace-salir" href="entrar.html">Salir</a>
  </div>
</header>

<main class="contenedor contenedor--mini">
  <h1 class="titulo-pagina">Mis partidas</h1>

  <!-- Estado de ejemplo: respuesta 409 por nombre repetido -->
  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <label style="flex: 1 1 280px; display: flex"><span class="solo-lector">Nombre de la nueva partida</span>
        <input class="campo" style="flex: 1 1 auto; background: var(--superficie); border-radius: 12px" type="text" maxlength="40" value="Modo Rush" aria-invalid="true"></label>
      <button type="button" class="btn btn--primario">Crear partida</button>
    </div>
    <span class="error-campo" role="alert">Ya tienes una partida con ese nombre.</span>
  </div>

  <ul class="lista tarjeta" style="padding: 4px 24px">
    <li style="flex-direction: column; align-items: stretch; gap: 12px; padding: 18px 0">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
        <div style="flex: 999 1 240px; min-width: 0"><a href="panel.html" style="font-weight: 600; font-size: 17px; color: var(--texto); text-decoration: none">Primera partida</a>
          <p class="meta" style="margin-top: 2px">Actualizada hoy a las 18:42</p></div>
        <span style="font-family: var(--fuente-display); font-weight: 500; font-size: 24px">58 %</span>
        <div style="display: flex; gap: 4px"><button type="button" class="btn btn--secundario btn--pequeno">Renombrar</button><button type="button" class="btn btn--texto-peligro btn--pequeno">Borrar</button></div>
      </div>
    </li>
    <li style="flex-direction: column; align-items: stretch; gap: 12px; padding: 18px 0">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
        <div style="flex: 999 1 240px; min-width: 0"><a href="panel.html" style="font-weight: 600; font-size: 17px; color: var(--texto); text-decoration: none">Modo Rush</a>
          <p class="meta" style="margin-top: 2px">Actualizada el 15 nov</p></div>
        <span style="font-family: var(--fuente-display); font-weight: 500; font-size: 24px">22 %</span>
        <div style="display: flex; gap: 4px"><button type="button" class="btn btn--secundario btn--pequeno">Renombrar</button><button type="button" class="btn btn--texto-peligro btn--pequeno">Borrar</button></div>
      </div>
      <!-- Estado de ejemplo: confirmación antes de borrar -->
      <div role="alertdialog" aria-label="Confirmar borrado" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 12px; background: var(--error-fondo)">
        <span>Se borrarán sus zonas, slimes y logros. No se puede deshacer.</span>
        <span style="display: flex; gap: 8px"><button type="button" class="btn btn--secundario btn--pequeno">Cancelar</button><button type="button" class="btn btn--peligro btn--pequeno">Borrar partida</button></span>
      </div>
    </li>
  </ul>
</main>
</body>
</html>
